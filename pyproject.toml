[project]
name = "flystar"
description = "FlyStar Astrometric Analysis Package"
readme = "README.rst"
authors = [{name="Jessica Lu", email="jlu.astro@berkeley.edu"},
           {name="Matt Hosek", email="mwhosek@astro.ucla.edu"}]
license = "BSD-3-Clause"
license-files = ["licenses/LICENSE.rst"]
requires-python = ">=3.9"
dynamic = ["version"]

# jplephem is required, not optional: astropy reaches for it whenever a
# solar-system ephemeris is evaluated, which the Parallax motion model does, so
# without it Parallax raises ModuleNotFoundError at runtime.
dependencies = [
    "numpy",
    "astropy>=3.2",
    "scipy",
    "matplotlib",
    "tqdm",
    "joblib",
    "pandas",
    "h5py",
    "jplephem",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
docs = ["sphinx-astropy"]
test = ["pytest-astropy"]
# Imported lazily, inside the functions that need them, so the package works
# without these -- but the features that use them do not.
#   shapely    -- polygon footprints for the initial guess (align, match)
#   astroquery -- Gaia and JPL Horizons queries (analysis, parallax)
#   plotly     -- interactive diagnostic plots (align, plots)
optional = ["shapely", "astroquery", "plotly"]

[project.urls]
homepage = "https://github.com/MovingUniverseLab/flystar"
repository = "https://github.com/MovingUniverseLab/flystar"
documentation = "https://flystar.readthedocs.io"

[build-system]
# setuptools 77 is the first release to accept an SPDX `license` string and
# `license-files` in [project].
requires = ["setuptools>=77",
            "setuptools_scm",
            "wheel"]
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ["flystar*"]
# Tests stay in the repository rather than in the installed package.
# flystar/tests/test_data is 24 MB, 22 MB of it a single FITS catalogue, which
# would otherwise be 96% of the wheel. The suite also locates its fixtures via
# flystar.__path__, so shipping the test modules without that data would leave
# an installed suite that cannot run.
exclude = ["flystar.tests*"]

[tool.setuptools.package-data]
flystar = ["data/*"]
