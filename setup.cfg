# Project metadata and dependencies live in pyproject.toml.
# Only tooling configuration that has no [project] equivalent stays here:
# setuptools reads [project] in preference to [metadata]/[options], so
# anything duplicated below would be silently discarded.

[tool:pytest]
testpaths = "flystar" "docs"
astropy_header = true
doctest_plus = enabled
text_file_format = rst
#addopts = --doctest-rst

[coverage:run]
omit =
    flystar/_astropy_init*
    flystar/conftest.py
    flystar/*setup_package*
    flystar/tests/*
    flystar/*/tests/*
    flystar/extern/*
    flystar/version*
    */flystar/_astropy_init*
    */flystar/conftest.py
    */flystar/*setup_package*
    */flystar/tests/*
    */flystar/*/tests/*
    */flystar/extern/*
    */flystar/version*

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about packages we have installed
    except ImportError
    # Don't complain if tests don't hit assertions
    raise AssertionError
    raise NotImplementedError
    # Don't complain about script hooks
    def main\(.*\):
    # Ignore branches that don't pertain to this version of Python
    pragma: py{ignore_python_version}
    # Don't complain about IPython completion helper
    def _ipython_key_completions_
