# Run the flystar test suite (flystar/tests) on pushes to dev/main and on
# every pull request.
#
# The suite locates its fixtures through flystar.__path__, so flystar is
# installed in editable mode from the checkout (the test data is not part of
# the installed package).
#
# The Parallax tests evaluate astropy's JPL ephemeris, which downloads
# de430.bsp (~115 MB) from NAIF on first use. astropy's download cache is
# kept between runs so that file is fetched once, not on every run.

name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Plotting code must not try to open a display.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools_scm needs the tags to find the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install flystar and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      # Ask astropy where its download cache lives (and create it), rather
      # than hard-coding a path that depends on HOME and XDG settings.
      - name: Locate astropy download cache
        id: astropy-cache
        run: |
          echo "dir=$(python -c 'from astropy.config import get_cache_dir; print(get_cache_dir())')" >> "$GITHUB_OUTPUT"

      - name: Cache astropy downloads (JPL ephemeris, leap seconds)
        uses: actions/cache@v4
        with:
          path: ${{ steps.astropy-cache.outputs.dir }}
          key: astropy-cache-v1-${{ matrix.python-version }}

      - name: Run tests
        run: python -m pytest flystar/tests -q -ra

      - name: Show astropy download cache contents
        if: always()
        run: python -c "from astropy.utils.data import cache_contents; print('\n'.join(cache_contents()) or '(empty)')"
