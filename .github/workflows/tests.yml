# Run the flystar test suite (flystar/tests) on pushes to dev/main and on
# every pull request.
#
# The suite locates its fixtures through flystar.__path__, so flystar is
# installed in editable mode from the checkout (the test data is not part of
# the installed package).
#
# The Parallax tests evaluate astropy's JPL ephemeris, which downloads
# de430.bsp (~115 MB) from NAIF on first use. astropy's download cache is
# kept between runs so that file is fetched once, not on every run.

name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # Plotting code must not try to open a display.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools_scm needs the tags to find the version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache astropy downloads (JPL ephemeris, leap seconds)
        uses: actions/cache@v4
        with:
          path: ~/.astropy/cache
          key: astropy-cache-v1

      - name: Install flystar and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest flystar/tests -q -ra
